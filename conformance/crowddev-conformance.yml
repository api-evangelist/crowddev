note: >-
  Upgraded from derived to searched on 2026-08-14 against the first-party ADR set in
  docs/adr/ and live probes of cm.lfx.dev. No compliance program, certification or attestation
  (SOC 2, ISO 27001, PCI, HIPAA, FedRAMP) is published for the Community Data Platform, so no
  Compliance pointer is emitted in apis.yml. No security.txt, bug bounty or vulnerability
