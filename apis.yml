apis:
- aid: crowddev:crowddev-advisories-api
  name: Crowd.dev Advisories API
  description: >-
    Security advisories for a package, split out of package detail. The draft contract gates these behind
    a dedicated read:advisories scope; until Auth0 issues it, the implementation reuses read:packages
    (advisories need no stewardship read). Confirm the final scope name (read:advisories vs cdp:advisories:read)
    with Akrites/product.
  humanURL: https://docs.crowd.dev/docs/
  baseURL: https://cm.lfx.dev/api/v1
  tags:
  - Advisories
  properties:
  - type: OpenAPI
    url: openapi/crowddev-advisories-api-openapi.yml
- aid: crowddev:crowddev-affiliations-api
  name: Crowd.dev Affiliations API
  description: Bulk contributor affiliation lookups by GitHub handle.
  humanURL: https://docs.crowd.dev/docs/
  baseURL: https://cm.lfx.dev/api/v1
  tags:
  - Affiliations
  properties:
  - type: OpenAPI
    url: openapi/crowddev-affiliations-api-openapi.yml
- aid: crowddev:crowddev-contacts-api
  name: Crowd.dev Contacts API
  description: >-
    Security contacts for a package — includes contact PII (e.g. reporter emails). The contract gates
    these behind a dedicated cdp:maintainers:read scope and forbids reaching them via the packages scope;
    until Auth0 issues it, the implementation requires read:maintainer-roles (NOT read:packages). The
    response shape is still under discussion upstream (reportingMethods / reportingGuidelines / integrationHints
    are reserved and always null today).
  humanURL: https://docs.crowd.dev/docs/
  baseURL: https://cm.lfx.dev/api/v1
  tags:
  - Contacts
  properties:
  - type: OpenAPI
    url: openapi/crowddev-contacts-api-openapi.yml
