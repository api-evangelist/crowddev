aid: crowddev
name: Crowd.dev
description: >-
  Crowd.dev is an open-source developer data platform that centralizes
  community, product, and commercial data to unify contributor identities,
  resolve who is engaging with an open-source project, and activate that data
  for developer relations and community-led growth. Founded in Berlin and
  backed by Seedcamp, crowd.dev was acquired by the Linux Foundation in April
  2024 and now powers the LFX Community Data Platform (CDP). The codebase is
  Apache-2.0 open source at github.com/CrowdDotDev (now linuxfoundation/crowd.dev),
  and the CDP Public API exposes transactional REST endpoints for member and
  organization profiles, identity verification, work-experience and
  project-affiliation management, contributor affiliation lookups, and
  open-source package/stewardship intelligence.
