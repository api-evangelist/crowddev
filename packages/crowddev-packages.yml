note: >-
  crowd.dev / LFX Community Data Platform publishes NO client SDK on any package registry.
  The monorepo root package.json is `"private": true` and every pnpm workspace package under
  services/libs (@crowd/types, @crowd/common, @crowd/redis, @crowd/database, ...) is an internal
  workspace dependency that is never published - each of those names 404s on registry.npmjs.org.
  The only distribution channel is the Apache-2.0 source repository itself plus the container
  images the in-repo `./scripts/cli build-and-push` flow builds. Consumers of the CDP Public API
  integrate over plain HTTPS with an Auth0 bearer token; there is no generated or hand-written
  client library to depend on. No `SDKs` pointer is emitted in apis.yml, because there is no SDK.

