note: >-
  There is no pricing page and no priced tiers. crowd.dev was acquired by the Linux Foundation in
  April 2024 and the commercial product was retired: crowd.dev now 301s to the source repository,
  crowd.dev/pricing resolves to the same GitHub page, and lfx.linuxfoundation.org/pricing is a 404.
  The successor - LFX Community Data Platform - is offered at no charge, and the CDP Public API is
  reached with Auth0 machine-to-machine credentials issued by the Linux Foundation rather than
  bought. There is no self-serve API key, no metered plan, and no published quota attached to a tier;
  the only published quotas are the rate limits in rate-limits/crowddev-rate-limits.yml, which apply
  to everyone.

