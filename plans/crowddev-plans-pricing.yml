api_access:
  self_serve: false
  mechanism: Auth0 machine-to-machine client credentials on the `cdp_public_api` audience
  issuance: >-
    Credentials are provisioned per consumer by the Linux Foundation (lfx-secrets-management), not
    through a signup form. ADR-0016 records the Akrites consumer receiving an RSA private key,
    client_id and credential kid by hand through a 1Password vault item.
  evidence: https://github.com/linuxfoundation/crowd.dev/blob/main/docs/adr/0016-akrites-cdp-public-api-authentication.md
  price: 0

historical:
  note: >-
    Pre-acquisition crowd.dev sold a hosted SaaS alongside the Apache-2.0 self-hosted edition.
    Those tiers are gone; no archived pricing is recorded here because none is currently published
    by the provider.
